---
pre-commit:
  parallel: true
  jobs:
    - name: yamllint
      glob: "*.{yml,yaml}"
      run: yamllint {staged_files}
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck --external-sources --severity=style {staged_files}
pre-push:
  parallel: true
  jobs:
    - name: yamllint
      glob: "*.{yml,yaml}"
      run: yamllint {all_files}
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck --external-sources --severity=style {all_files}
