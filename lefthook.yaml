---
pre-commit:
  parallel: true
  jobs:
    - name: yamllint
      glob: "*.{yml,yaml}"
      run: yamllint --strict {staged_files}
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck --external-sources --severity=style {staged_files}
pre-push:
  parallel: true
  jobs:
    - name: tags-test
      glob: "oci/tags*.sh"
      run: bash oci/tags.test.sh
    - name: memory-cap-test
      glob: "container-build/buildah/memory-cap*.sh"
      run: bash container-build/buildah/memory-cap.test.sh
    - name: release-test
      glob: "forgejo-release/release*.sh"
      run: bash forgejo-release/release.test.sh
    - name: gh-release-test
      glob: "gh-release/*.sh"
      run: bash gh-release/release.test.sh
    - name: preflight-test
      glob: "preflight/*.sh"
      run: bash preflight/preflight.test.sh
    - name: store-retry-test
      glob: "store/retry*.sh"
      run: bash store/retry.test.sh
    - name: event-test
      glob: "event/*.sh"
      run: bash event/event.test.sh
    - name: yamllint
      glob: "*.{yml,yaml}"
      run: yamllint --strict {all_files}
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck --external-sources --severity=style {all_files}
