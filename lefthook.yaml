---
pre-commit:
  parallel: true
  jobs:
    - name: yamllint
      glob: "*.{yml,yaml}"
      run: yamllint --strict {staged_files}
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck --external-sources --severity=style {staged_files}
pre-push:
  parallel: true
  jobs:
    - name: tags-test
      glob: "oci/tags*.sh"
      run: bash oci/tags.test.sh
    - name: yamllint
      glob: "*.{yml,yaml}"
      run: yamllint --strict {all_files}
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck --external-sources --severity=style {all_files}
