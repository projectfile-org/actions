#
# oci-push — the registry-push realisation of the `oci-push` provider leaf (see
# projectfile/ci §9 publish). pf-ci keeps only "which provider +
# ordering" (the neutral DAG); the recipe lives HERE, pinned in workflows as
# `projectfile/ci-actions/oci-push@v1`. It is the CONSUMER end of the same
# build→artifact hand-off the image scans use: pf-ci emits a download-artifact
# step that pulls this cell's `<artifact-name>.tar` BEFORE this action runs, so the
# action only logs in and pushes — no build, no buildx.
#
# Transport: push.sh uses skopeo to copy the archive DIRECTLY to the registry
# (`skopeo copy docker-archive:<tar> docker://<ref>`), never loading it into the
# daemon's image store. The previous load+retag+push left a tagged copy (and a
# dangling retag-orphan) on the shared forgejo runner's persistent store on EVERY
# release — the publish job was the single biggest disk-bloat source. The dest tag
# is the only naming that matters; the archive's stamped name is ignored.
#
# ARITY, not two actions: with `archives` set the cell holds one tar per declared
# architecture and publishes them as ONE manifest list per cascade tag (buildah
# assembles the index locally and `manifest push --all` uploads members and index
# together). The registry therefore gains only the cascade tags, every one of them
# multi-arch. Publishing each architecture under its own `-<arch>` tag instead would
# leave that scaffolding in the tag list forever — most registries, this workspace's
# own included, log `Registry does not implement RepositoryRemover` and cannot delete
# a tag, and Docker Hub needs a non-registry API for it.
#
# Auth is NOT an input: the leaf declares `env: [REGISTRY_USERNAME, REGISTRY_PASSWORD]`
# and pf-ci's per-target credentials overlay binds those NAMES to secret refs on
# THIS job. A composite action's bash sees the job's OS env (it cannot read the
# `secrets` context), so push.sh reads the two vars directly — the env NAME is what
# scopes the secret to the push job.
name: oci-push
description: Log in and copy a cell-keyed OCI archive tar straight to a registry via skopeo.
inputs:
  artifact-name:
    # Cell-keyed stem from pf-ci (image-<axis>-…); the matching <artifact-name>.tar
    # was pulled by the download-artifact step pf-ci emits ahead of this action.
    # SUPERSEDED by `archives` when the project declares architectures: the cell then
    # carries one tar per arch and no single stem can name them.
    description: Cell-keyed artifact + tar stem (ignored when `archives` is set).
    required: false
    default: ""
  image:
    # The basename ref pf-ci composed (<ns>/<name>:<tag>, Docker Hub form). Its
    # repo half (everything left of the last `:`) is the prefix each cascade tag is
    # pushed under; its tag half is the lone tag pushed when VERSION is empty (the
    # no-cascade fallback). skopeo ignores the archive's stamped name and renames at
    # the dest, so the ref here is purely the push naming contract.
    description: Basename ref whose repo half prefixes every push tag.
    required: true
  version:
    # The git ref this build published from (pf-ci passes ${{ github.ref_name }}).
    # On a PREVIEW run that is a branch name and `preview` below takes over; on a release
    # it is the tag, and push.sh lowers it into the
    # SEMVER tag cascade: a stable X.Y.Z pushes X.Y.Z + X.Y + X + latest; a pre-release
    # (X.Y.Z-rc1) or non-semver tag pushes ONLY its exact spelling (latest/heads stay put).
    # A leading `v` is stripped. EMPTY keeps the historical single push of the load tag.
    description: Git tag driving the semver tag cascade (empty => single load-tag push).
    required: false
    default: ""
  preview:
    # The BRANCH name when this run is a preview — a push to a branch that is not the
    # project default (pf-ci gates the publish node on the `preview` event token and
    # threads the ref name here; empty on a tag). It OVERRIDES `version` in tags.sh: the
    # cascade collapses to the single `latest-<branch>` tag, so `latest` and every semver
    # head keep pointing at the last release. It also narrows the destinations to the
    # primary sink, because most registries cannot delete a tag and a preview that reached
    # a public mirror would stay in its tag list forever.
    description: Branch name when this run is a preview (empty => a release, full cascade).
    required: false
    default: ""
  registry:
    # Push-target registry — the OUTPUT_REGISTRY forge var pf-ci threads (the
    # forge-dependent place THIS project publishes TO). DISTINCT from the per-namespace
    # INPUT registries (B19_DOCKER_REGISTRY & friends = where base images come FROM); the
    # two can differ (pull b19/go from kiota.ch, publish d9t/go-tools to ghcr.io). Set per
    # forge in the vars store (org var = default, repo var = project-wise override). The
    # value is the full push prefix (host + optional owner/path); empty => Docker Hub.
    description: Push-target registry to log in to and prefix the push ref (OUTPUT_REGISTRY; empty => Docker Hub).
    required: false
    default: ""
  refs:
    # One `<sink> <ref>` line per destination this archive publishes to, each ref
    # COMPOSED by the document that declared the sink (org.projectfile.sinks.<name>.ref
    # under publish.<forge>.push). This is what lets one build land nested on GHCR and
    # flattened on Docker Hub: the path grammar is the sink’s, never this action’s.
    # The tag half is ignored — the semver cascade below supplies its own.
    # Credentials key on the SINK name (<SINK>_REGISTRY_USERNAME / _PASSWORD), because
    # two accounts on one host need two secrets; the unprefixed pair stays the default.
    # EMPTY falls back to registry + image, the single-destination spelling every
    # project without a publish route still uses.
    description: Newline-separated `<sink> <ref>` destinations (empty => registry + image).
    required: false
    default: ""
  sink:
    # The publish CELL's own destination — the sink NAME this cell publishes, the
    # rest of `refs` skipped. pf-ci binds it to the destination matrix axis, so
    # a job with two declared sinks runs two cells: one credential each, and a
    # registry refusing a push fails ITS cell instead of the whole release. EMPTY
    # keeps the single-job fan-out (every declared destination from one cell).
    description: Sink name this cell publishes (empty => every destination in refs).
    required: false
    default: ""
  archives:
    # One `<arch> <artifact-name>` line per DECLARED architecture, bound by pf-ci
    # from the M6E_ARCH axis it mints out of org.projectfile.architecture. Present => this
    # cell publishes a MANIFEST LIST: the per-arch tars are assembled into one index and
    # pushed to the cascade tags, so the registry serves `<repo>:1.2.3` as multi-arch and
    # gains NO per-architecture tag. A `-<arch>` tag is not a release artefact — it is
    # scaffolding, and a registry that cannot delete tags (most of them) keeps it forever.
    # Empty => the single-image path below, byte for byte what a non-declaring project
    # has always published.
    description: Newline-separated `<arch> <artifact-name>` archives to index (empty => single image).
    required: false
    default: ""
outputs:
  digest:
    # The content digest (sha256:…) of what was published, tag-independent (every cascade
    # tag points at the same content). On the multi-arch path that is the INDEX digest,
    # which is the right thing to sign: it is what a consumer pulling `<repo>:<tag>`
    # resolves, and it commits to every member. A downstream cosign sign/attest step
    # consumes `${repo}@${digest}` so the signature binds the immutable content, not a
    # mutable tag. push.sh also drops it in $M6E_DIGEST_FILE for the in-job fused signer,
    # and the tag cascade in $M6E_TAGS_FILE for the in-job events emit step.
    description: Content digest (sha256:…) of the pushed image or index.
    value: ${{ steps.push.outputs.digest }}
runs:
  using: composite
  steps:
    - id: push
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
        PREVIEW: ${{ inputs.preview }}
        REGISTRY: ${{ inputs.registry }}
        REFS: ${{ inputs.refs }}
        SINK: ${{ inputs.sink }}
        ARCHIVES: ${{ inputs.archives }}
      run: bash "$GITHUB_ACTION_PATH/push.sh"
