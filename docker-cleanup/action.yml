#
# docker-cleanup — reap the run-scoped image tag and live-stack network a fused job
# left behind. ci-resolver lowers a Load-ing job's teardown to this single always()-
# guarded step (the fused `live` stack: container-build stamps a UNIQUE-per-run tag,
# `docker load` enters it into the store, `compose up` creates a run-scoped network;
# without reaping both, every run accumulates one image and possibly one network).
# Keeping the imperative reaps + their guards in this versioned action leaves the
# rendered workflow a clean `uses:` with no inline `docker rmi`/`docker network` shell
# (ci-resolver Law 2 — the recipe lives in the pinned action, not the YAML).
#
# Both inputs are OPTIONAL: a non-Load job has no image to reap (and never created a
# network), so the resolver emits empty for both and cleanup.sh becomes a no-op.
name: docker-cleanup
description: Best-effort reap of a run-scoped image tag and the live stack's network.
inputs:
  image:
    # The run-scoped image ref `docker load` entered into the daemon (selfImageTagExpr:
    # <basename>:<M6E_TAG>-<M6E_RUN_SCOPE>, unique per run). Reaped with `docker rmi -f`
    # because the tag is single-use — the old mutable `latest` tag self-recycled on the
    # next load, the run-unique tag does not, so without this the store gains one image
    # per run forever. Empty => no image reap (a scanner reads the tar as a file, never
    # entering the store).
    description: Run-scoped image ref to reap (empty => skip).
    required: false
    default: ""
  network:
    # The live stack's own network (M6E_COMPOSE_PROJECT_NAME + "-network"). Reaped
    # separately from `compose down` because a failed/timed-out `up` can leave an
    # endpoint attached: compose reports the removal error WITHOUT failing the step, so
    # the job goes green and the run-scoped network is orphaned forever. The `inspect`
    # guard keeps the common path (down did remove it) from logging a bogus "No such
    # network"; a real removal error still surfaces. Empty => no network reap.
    description: Live stack network name to reap (empty => skip).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        NETWORK: ${{ inputs.network }}
      run: bash "$GITHUB_ACTION_PATH/cleanup.sh"
