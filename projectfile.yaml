  title:
    en: projectfile/actions
  description:
    en: The external provider action library for pf-ci. Each provider name maps to one composite action, pinned and consumed as <owner>/actions/<provider>@v1 — the owner being this library’s mirror on whichever forge the workflow runs on; the resolver keeps the dispatch while this library owns the native CI recipe for each target (Ports and Adapters).
    es: La biblioteca de acciones de proveedores externos para pf-ci. Cada nombre de proveedor se corresponde con una acción compuesta, fijada y consumida como <owner>/actions/<provider>@v1 — donde el propietario es la réplica de esta biblioteca en la forja donde se ejecuta el flujo de trabajo; el resolver conserva el despacho mientras esta biblioteca posee la receta de CI nativa para cada objetivo (Ports and Adapters).
    uk: Бібліотека дій зовнішніх провайдерів для pf-ci. Кожне імʼя провайдера відповідає одній композитній дії, зафіксованій і використовуваній як <owner>/actions/<provider>@v1 — де власник це дзеркало цієї бібліотеки на тій кузні, де виконується робочий процес; резолвер тримає диспетчеризацію, а ця бібліотека володіє рідною CI-рецептою для кожної цілі (Ports and Adapters).
