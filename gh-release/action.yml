# gh-release — mint a tag’s GitHub release from its tag message, attaching each binary.
name: gh-release
description: Mint a GitHub release via gh, titled by the tag message, attaching binaries and sidecars.
# Inputs ride the step env: RELEASE_TAG (else M6E_RELEASE_TAG), RELEASE_PATH, RELEASE_URL, RELEASE_TARGET; GH_TOKEN for gh.
runs:
  using: composite
  steps:
    - shell: bash
      run: bash "$GITHUB_ACTION_PATH/release.sh"
