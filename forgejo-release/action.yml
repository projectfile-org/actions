#
# forgejo-release — attach one cell-keyed binary to a Forgejo release. pf-ci
# keeps only "which action + ordering" (the neutral DAG); the recipe lives HERE,
# pinned in workflows as `projectfile/ci-actions/forgejo-release@v1`. It is the
# CONSUMER end of the same build→artifact hand-off the image scans use: pf-ci
# emits a download-artifact step that restores the producer's `dist/` tree to the
# workspace BEFORE this action runs, so the action only logs in and attaches — no
# build.
#
# The asset is the binary the build-binaries cell produced, found by suffixing the
# resolved artifact path with the cell axes: <release-asset-path>-<os>-<arch>. The
# pair comes from TARGET_OS/TARGET_ARCH on the job env, falling back to GOOS/GOARCH
# — the language-neutral names let a Crystal or Zig cell reuse this action verbatim,
# while a Go project keeps the axis names its build already binds.
#
# Create-then-attach idempotency: `tea release create` errors HTTP 409 if a release
# for the tag already exists (the 2nd..Nth matrix cell, a re-run, or a manual
# pre-create). The first cell creates; later cells fall back to
# `tea release assets create` — the subcommand is `assets` (aliases `asset`, `a`);
# tea has no `attachment` verb, and urfave/cli answers an unknown one by falling
# through to the parent `releases` action instead of reporting it. The fallback
# clobbers a same-named attachment first, because Forgejo accepts duplicates. The
# tag is the release title (tea's SDK requires a non-empty title — the historical
# `tea release create --tag`-only call failed with "title is empty").
#
# Auth is NOT an input: the leaf declares `env: [FORGEJO_TOKEN]` and pf-ci's
# per-target credentials overlay binds that NAME to a secret ref on THIS job. A
# composite action's bash sees the job's OS env (it cannot read the `secrets`
# context), so release.sh reads the token from the env directly — the env NAME is
# what scopes the secret to the release job. A cell naming a `sink` reads the
# DERIVED name (<SINK>_TOKEN) instead, so two destinations never share one secret.
# `server-url` / `repo` default to the ambient Forgejo Actions context.
name: forgejo-release
description: Attach one cell-keyed binary to a Forgejo release via tea (create-then-attach across matrix cells).
inputs:
  version:
    # The git tag this release publishes from (pf-ci passes ${{ github.ref_name }};
    # binaries-released is gated tag-only, so it is always a tag). The tag is BOTH the
    # release tag and the release title (tea's SDK requires a non-empty title).
    description: Git tag to create the release at (also the release title).
    required: true
  release-asset-path:
    # The UNSUFFIXED binary path resolved from org.projectfile.artifacts (the single
    # kind=binary entry, e.g. dist/pf-cli). The action suffixes it per cell:
    # <path>-<os>-<arch> (TARGET_OS/TARGET_ARCH from the matrix env, GOOS/GOARCH as
    # the fallback). The build→consumer download edge restored the producer's dist/
    # tree to the workspace already.
    description: Unsuffixed binary path; the cell axes are appended to locate the asset.
    required: true
  server-url:
    # WHERE this cell releases. Empty => the ambient Forgejo Actions context
    # (GITHUB_SERVER_URL), which is every project releasing only to the forge it runs
    # on. Set => a foreign forge, which is what a Codeberg release needs: Codeberg
    # grants no build minutes, so its release is pushed from kiota's pipeline.
    description: Forge base URL to release on (empty => the running forge).
    required: false
    default: ""
  repo:
    # The `<owner>/<repo>` on server-url. Its own input rather than derived, because
    # the name differs per forge — kiota holds projectfile/bridge, GitHub holds
    # damian-buho/projectfile-bridge. Empty => the ambient GITHUB_REPOSITORY.
    description: owner/repo on server-url (empty => the running repository).
    required: false
    default: ""
  sink:
    # The release CELL's destination NAME. It selects the token: <SINK>_TOKEN,
    # derived by uppercasing and mapping `-` to `_`, so a new destination is a data
    # edit. Falls back to FORGEJO_TOKEN, which names a protocol rather than a
    # destination and is what a single-forge project already binds.
    description: Destination name selecting <SINK>_TOKEN (empty => FORGEJO_TOKEN).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
        RELEASE_PATH: ${{ inputs.release-asset-path }}
        SERVER_URL: ${{ inputs.server-url }}
        REPO: ${{ inputs.repo }}
        SINK: ${{ inputs.sink }}
      run: bash "$GITHUB_ACTION_PATH/release.sh"
