# container-build/buildx — the BUILDX (daemon) realisation of the `container-build`
# provider leaf (see projectfile/ci-resolver general-plan.md, Q3). ci-resolver keeps
# only "which provider + ordering" (the neutral DAG); the recipe + the OCI-tar
# build→scan hand-off live HERE, pinned in workflows as
# `projectfile/ci-actions/container-build/buildx@v1`. Its daemonless sibling
# `container-build/buildah` emits the SAME tar — the two are drop-in analogues
# selected per-target by ci-resolver (gha/forgejo default buildx; Tekton buildah).
name: container-build-buildx
description: Build a Dockerfile to an OCI archive tar (buildx) and upload it as a cell-keyed artifact.
inputs:
  artifact-name:
    # Cell-keyed stem from ci-resolver (image-<axis>-…). The build→scan hand-off
    # contract: this action emits <artifact-name>.tar and uploads it under
    # <artifact-name>, so a downstream image-scan in the same cell pulls only its
    # own tar and reads it DAEMONLESSLY — no registry, no intra-pipeline creds.
    description: Cell-keyed artifact + tar stem.
    required: true
  build-args:
    # Newline-separated build-arg NAME=VALUE pairs (matrix axes + the manifest's
    # var/get/ci args, resolved by ci-resolver). The VALUE rides the input because a
    # composite action does NOT inherit the caller job's `env:` as process env (the
    # Forgejo runner drops it) — a by-NAME `--build-arg NAME` passthrough would build
    # with an empty arg. A bare NAME (no `=`) falls back to reading it from env.
    description: Newline-separated build-arg NAME=VALUE pairs.
    required: false
    default: ""
  file-args:
    # Whitespace-separated NAME=path specs. The action reads the first non-comment,
    # non-blank line of each path at build time and passes it as --build-arg
    # NAME=<value> (the per-cell digest pin). Replaces the decomment/grep step that
    # used to be inlined in the workflow — the YAML stays declarative.
    description: Whitespace-separated NAME=path file-sourced build-args.
    required: false
    default: ""
  mounts:
    # Abstract binds (the tool's `mounts` map) lowered to a whitespace-separated
    # name=mountpoint list. Each is satisfied with a throwaway EMPTY dir and a
    # --build-context — the concrete realisation of an abstract bind, kept HERE (the
    # model never names it).
    description: Whitespace-separated name=mountpoint bind list.
    required: false
    default: ""
  image:
    # The resolved image ref ci-resolver composes from the project basename
    # (<registry>/<ns>/<name>:<tag>). Stamped into the OCI archive (name=) so the
    # tar is self-describing — a downstream `docker load` restores THIS tag and the
    # compose stack finds it. Empty => anonymous archive (the historical behaviour).
    description: Image ref to stamp into the OCI archive (empty => anonymous).
    required: false
    default: ""
  context:
    description: Build context path.
    required: false
    default: "."
  pf-cli-image:
    # The projectfile/cli image ref (registry + tag) ci-resolver composes from the
    # ci.images PF_CLI_IMAGE var. oci-labels.sh reads the projectfile through it when
    # no host pf-cli exists (the hostexecutor case) — WITHOUT it the projectfile
    # labels are silently skipped. Rides a `with:` input, not job env: the Forgejo
    # runner drops job env: for composite actions. Empty => host pf-cli or skip.
    description: projectfile/cli image ref for the pf-cli container fallback (empty => host pf-cli or skip).
    required: false
    default: ""
  target:
    # Dockerfile stage to build (buildx --target), from ci-resolver's per-lowering
    # org.projectfile.ci.build-target.<gha|forgejo>. Empty => no --target => last
    # stage, matching the make-plane buildx-build default.
    description: Dockerfile stage to build (empty => last stage).
    required: false
    default: ""
  platform:
    # Target architecture for THIS cell, bound by ci-resolver to the M6E_ARCH axis it
    # mints from org.projectfile.architecture. A bare arch (`arm64`); platform.sh composes
    # `linux/` and gates the QEMU binfmt handler before the build. One arch per call, so
    # `--output type=docker` still emits the single-image archive every consumer reads —
    # a multi-platform pass could only write an OCI archive, which both scanners reject.
    # Empty => today's native build with no flag at all.
    description: Target architecture for this cell (empty => native build, no flag).
    required: false
    default: ""
runs:
  using: composite
  steps:
    # NO setup-buildx-action: that spins up an isolated `docker-container` builder
    # that neither shares the daemon's local image store (so private-registry base
    # images present only locally must be re-pulled) nor is wanted on runners using
    # the containerd image store. We build on the DEFAULT `docker` builder, whose
    # buildkit — with the containerd snapshotter — both reads local images and emits
    # `--output type=oci`. (A runner on the legacy overlay2 store would need the
    # containerd image store enabled for OCI output; that is the workspace default.)
    - shell: bash
      env:
        BUILD_ARGS: ${{ inputs.build-args }}
        FILE_ARGS: ${{ inputs.file-args }}
        MOUNTS: ${{ inputs.mounts }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        IMAGE: ${{ inputs.image }}
        CONTEXT: ${{ inputs.context }}
        PF_CLI_IMAGE: ${{ inputs.pf-cli-image }}
        M6E_BUILD_TARGET: ${{ inputs.target }}
        PLATFORM: ${{ inputs.platform }}
      run: bash "$GITHUB_ACTION_PATH/build.sh"
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-name }}.tar
        # artifact-name is run_id-scoped (not per-attempt), so a re-run re-uploads under
        # the same name; upload-artifact@v4+ refuses a duplicate without this.
        overwrite: true
